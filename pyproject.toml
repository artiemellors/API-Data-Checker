[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "api-checker"
version = "0.1.0"
description = "Discover and sample public APIs embedded in retailer websites"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.43.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "tldextract>=5.1.0",
    "tenacity>=8.3.0",
]

[project.scripts]
api-checker = "api_checker.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["api_checker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
