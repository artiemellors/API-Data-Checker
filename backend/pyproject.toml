[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-checker-backend"
version = "0.1.0"
description = "Retailer API Checker — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=2.1.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "playwright>=1.43.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "tldextract>=5.1.0",
    "tenacity>=8.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api_checker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
